services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: utas
      POSTGRES_PASSWORD: utas-local
      POSTGRES_DB: utas
    ports:
      - "127.0.0.1:54326:5432"
    volumes:
      - utas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utas -d utas"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  utas-postgres:
